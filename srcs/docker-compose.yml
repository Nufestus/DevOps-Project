services:

  wordpress:
    depends_on:
      - mariadb
    env_file: .env
    build: ./requirements/wordpress
    image: wordpress:start
    container_name: wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: always

  mariadb:
    env_file: .env
    build: ./requirements/mariadb
    image: mariadb:start
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    restart: always
  
  nginx:
    depends_on: 
      - wordpress
    env_file: .env
    build: ./requirements/nginx
    image: nginx:start
    container_name: nginx
    volumes:
      - wordpress:/var/www/html
    ports:
      - 443:443
    networks:
      - inception
    restart: always

networks:
  inception:
    name: aammisse

volumes:
  mariadb:
    name: wordpress-db
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/wordpress-db
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/wordpress